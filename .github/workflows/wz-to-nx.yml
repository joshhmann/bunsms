name: Publish verified WZ and NX release

# Native sources and operations must already be approved under
# /opt/buns/publication-inputs/<candidate_id> on the private LXC. The host CLI
# hashes them before staging; the synchronous Unix worker uses committed pinned
# tools and commits WZ + full16 NX once. No R2, live rsync or dispatch success.
# CI SSH routing/credentials are a REQUIRED deployment prerequisite, not present
# in the historical repository. Operator workstation SSH remains usable directly.
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Approved private LXC publication-inputs directory ID (contains native files and operations.json)'
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: private-asset-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise isolated input verification and preservation guards
        run: python3 -m unittest discover -s tools/tests -p test_prepare_nx_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: private-publication-source-contract
          path: |
            tools/publish_assets.sh
            tools/prepare_nx_release.py
            deployment/
          if-no-files-found: error
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: private-lxc
    timeout-minutes: 150
    steps:
      - name: Require configured private SSH route and pinned host key
        env:
          SSH_HOST: ${{ vars.BUNS_SSH_HOST }}
          SSH_USER: ${{ vars.BUNS_SSH_USER }}
          SSH_PORT: ${{ vars.BUNS_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.BUNS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BUNS_SSH_KNOWN_HOSTS }}
          CANDIDATE: ${{ inputs.candidate_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +x
          [[ "$CANDIDATE" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{7,95}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/buns_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/buns_deploy" "$HOME/.ssh/known_hosts"
          # A private/unreachable host fails here; no label claims a runner exists.
          ssh -i "$HOME/.ssh/buns_deploy" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/sbin/buns-private-deploy publish '$CANDIDATE' '$SOURCE_SHA'"
      - name: Remove ephemeral SSH credential
        if: always()
        run: rm -f "$HOME/.ssh/buns_deploy"
