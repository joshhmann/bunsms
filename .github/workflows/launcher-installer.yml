name: Launcher Installer (standalone)

# Build the explicitly labeled testing RC in its separate application identity.
# The player installer contains only Electron; Java/MySQL remain on the existing
# Linux server deployment and are never installer/runtime prerequisites.

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Explicit observed test OS; Server passes do not establish Windows 10/11 compatibility'
        type: choice
        options:
          - windows-2022
          - windows-2025
        default: windows-2022
      api_base:
        description: 'Dashboard API base baked into launcher'
        type: string
        default: 'https://buns.asslorde.com'
      manifest_url:
        description: 'Immutable testing RC complete-client manifest; never the production patch API'
        type: string
        default: 'https://buns.asslorde.com/client/candidates/full-content-rc1/launcher-manifest.json'

jobs:
  build-installer:
    runs-on: ${{ inputs.runner_os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install dependencies
        working-directory: launcher
        run: npm ci

      - name: Verify launcher install policy and transfers
        working-directory: launcher
        run: npm test

      - name: Package explicit testing channel authority
        working-directory: launcher
        shell: pwsh
        env:
          RC_API_BASE: ${{ inputs.api_base }}
          RC_MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          $release = Get-Content src/release-config.json -Raw | ConvertFrom-Json
          foreach ($url in @($env:RC_API_BASE, $env:RC_MANIFEST_URL)) {
            if (([uri]$url).Scheme -notin @('http', 'https')) { throw 'Invalid operator-selected RC authority' }
          }
          $release.apiBase = $env:RC_API_BASE
          $release.manifestUrl = $env:RC_MANIFEST_URL
          $release | ConvertTo-Json | Set-Content src/release-config.json -Encoding utf8NoBOM

      - name: Build Windows installer
        working-directory: launcher
        run: npx electron-builder --win --x64

      - name: Exercise actual installed Windows launcher UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $started = Get-Date
          $evidence = 'launcher-ui-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $installer = @(Get-ChildItem launcher/dist -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one testing RC installer' }
          $record = [ordered]@{
            installer = $installer[0].FullName
            size = $installer[0].Length
            sha256 = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            signature = (Get-AuthenticodeSignature $installer[0].FullName).Status.ToString()
            os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            startedUtc = [DateTime]::UtcNow.ToString('O')
            status = 'not-completed'
          }
          try {
            $install = Join-Path $env:RUNNER_TEMP 'BunsRcInstalled'
            $process = Start-Process $installer[0].FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
            $record.exitCode = $process.ExitCode
            $record.exitCodeHex = '{0:X8}' -f ([long]$process.ExitCode -band 0xffffffffL)
            if ($process.ExitCode -ne 0) { throw "RC installer failed: $($process.ExitCode) ($($record.exitCodeHex))" }
            node launcher/test/windows-ui.test.js "$install/BunsMS Testing RC.exe" $evidence
            if ($LASTEXITCODE) { throw 'Actual installed Electron UI check failed' }
            $record.status = 'installed-ui-observed'
          } catch {
            $record.status = 'failed'
            $record.error = $_.Exception.ToString()
            throw
          } finally {
            $record.applicationErrorEvents = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started; Id = @(1000, 1001) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'BunsMS|BunsRcInstalled' } |
              Select-Object TimeCreated, Id, ProviderName, Message)
            $record | ConvertTo-Json -Depth 12 | Set-Content "$evidence/installer-result.json" -Encoding utf8NoBOM
          }

      - name: Isolate official unpacked Electron UI
        if: always()
        shell: pwsh
        run: node launcher/test/windows-ui.test.js "launcher/dist/win-unpacked/BunsMS Testing RC.exe" launcher-ui-evidence/unpacked unpacked

      - name: Upload actual installed launcher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunsms-launcher-installed-ui
          path: launcher-ui-evidence/*
          if-no-files-found: warn

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunsms-launcher-installer
          path: launcher/dist/*.exe
          if-no-files-found: error
