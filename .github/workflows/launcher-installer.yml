name: Launcher Installer (standalone)

# Build the explicitly labeled testing RC in its separate application identity.
# The player installer contains only Electron; Java/MySQL remain on the existing
# Linux server deployment and are never installer/runtime prerequisites.

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Dashboard API base baked into launcher'
        type: string
        default: 'https://buns.asslorde.com'
      manifest_url:
        description: 'Immutable testing RC complete-client manifest; never the production patch API'
        type: string
        default: 'https://buns.asslorde.com/client/candidates/full-content-rc1/launcher-manifest.json'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install dependencies
        working-directory: launcher
        run: npm ci

      - name: Verify launcher install policy and transfers
        working-directory: launcher
        run: npm test

      - name: Package explicit testing channel authority
        working-directory: launcher
        shell: pwsh
        env:
          RC_API_BASE: ${{ inputs.api_base }}
          RC_MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          $release = Get-Content src/release-config.json -Raw | ConvertFrom-Json
          foreach ($url in @($env:RC_API_BASE, $env:RC_MANIFEST_URL)) {
            if (([uri]$url).Scheme -notin @('http', 'https')) { throw 'Invalid operator-selected RC authority' }
          }
          $release.apiBase = $env:RC_API_BASE
          $release.manifestUrl = $env:RC_MANIFEST_URL
          $release | ConvertTo-Json | Set-Content src/release-config.json -Encoding utf8NoBOM

      - name: Build Windows installer
        working-directory: launcher
        run: npx electron-builder --win --x64

      - name: Exercise actual installed Windows launcher UI
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem launcher/dist -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one testing RC installer' }
          $install = Join-Path $env:RUNNER_TEMP 'BunsRcInstalled'
          $process = Start-Process $installer[0].FullName -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "RC installer failed: $($process.ExitCode)" }
          node launcher/test/windows-ui.test.js "$install/BunsMS Testing RC.exe" launcher-ui-evidence

      - name: Upload actual installed launcher evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunsms-launcher-installed-ui
          path: launcher-ui-evidence/*
          if-no-files-found: warn

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunsms-launcher-installer
          path: launcher/dist/*.exe
          if-no-files-found: error
