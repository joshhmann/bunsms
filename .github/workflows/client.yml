name: Client DLL

# Windows-only build of the BunsMS injector DLL. Linux jobs must NEVER
# depend on this workflow; client/ is Win32-only by design (all addresses,
# Detours, WZ COM wrappers). Windows CI is the compile gate for client/.

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:
    inputs:
      native_smoke:
        description: "Run bounded actual Windows client startup capture (downloads the explicit baseline only when enabled)"
        type: boolean
        default: false
      published_runtime:
        description: "Exercise the exact published full cohort without reference priming or a freshly compiled runtime overlay"
        type: boolean
        default: false
      native_baseline_url:
        description: "Unpromoted complete native provenance JSON HTTPS URL (files: name, sha256, size)"
        type: string
        default: ""
      native_baseline_sha256:
        description: "Expected SHA256 of that exact native provenance JSON"
        type: string
        default: ""
      native_baseline_files_url:
        description: "HTTPS base URL containing the provenance-pinned native files"
        type: string
        default: ""
      item_image_variants_url:
        description: "Optional immutable diagnostic Item-image variant descriptor HTTPS URL; never a player release"
        type: string
        default: ""
      item_image_variants_sha256:
        description: "Expected SHA256 of that exact diagnostic descriptor"
        type: string
        default: ""
      test_backend:
        description: "Start the pinned real Java/MySQL/XML QA backend on this same Windows runner; never connects to production DB"
        type: boolean
        default: false
      exercise_login:
        description: "Submit normal OS login input to an own disposable GM0 account on the isolated loopback backend; not a gameplay pass"
        type: boolean
        default: false
      backend_bundle_url:
        description: "Frozen QA server archive HTTPS URL"
        type: string
        default: "https://buns.asslorde.com/rc-assets/client/r/4bf10f47bc05b2882a87435823742b7be2b77873bb45603ebd20f62fc13a6bb0/qa/backend-complete-0341c81.tar.gz"
      backend_bundle_sha256:
        description: "Exact frozen QA server archive SHA256"
        type: string
        default: "4bf10f47bc05b2882a87435823742b7be2b77873bb45603ebd20f62fc13a6bb0"
      backend_xml_url:
        description: "Matching complete server XML archive HTTPS URL"
        type: string
        default: "https://buns.asslorde.com/rc-assets/client/r/4fe81ac326226c37b5c8e4b92514d9f9ba4d536ce42e0fc3d236dafd3f768296/server-wz.tar.gz"
      backend_xml_sha256:
        description: "Exact matching complete server XML SHA256"
        type: string
        default: "4fe81ac326226c37b5c8e4b92514d9f9ba4d536ce42e0fc3d236dafd3f768296"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Parse real Windows smoke scripts before native execution
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem client/tools -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$($script.Name):$($_.Extent.StartLineNumber): $($_.Message)" }
              throw 'Windows smoke script syntax is invalid'
            }
          }

      - name: Configure (release-win32)
        run: cmake --preset release-win32
        working-directory: client

      - name: Build (release-win32)
        run: cmake --build --preset release-win32
        working-directory: client

      - name: Configure pinned Kaentake runtime
        run: cmake -S client/kaentake -B client/build-kaentake -G "Visual Studio 17 2022" -A Win32

      - name: Build pinned Kaentake runtime
        run: cmake --build client/build-kaentake --config Release --target injector launcher
      - name: Verify exact native companion and bridge export ABIs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x86/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'MSVC dumpbin is unavailable' }
          foreach ($check in @(
            @{ path = 'client/build/Release/BunsMS.dll'; name = 'BunsMS_Initialize' },
            @{ path = 'client/build-kaentake/Release/Kaentake.dll'; name = 'Kaentake_SetPrismItemEffBridge' },
            @{ path = 'client/build-kaentake/Release/Kaentake.dll'; name = 'KaentakeWeatherViewportWidth' },
            @{ path = 'client/build-kaentake/Release/Kaentake.dll'; name = 'KaentakeWeatherViewportHeight' },
            @{ path = 'client/build-kaentake/Release/Kaentake.dll'; name = 'KaentakeWeatherViewportAdjustY' }
          )) {
            $exports = & $dumpbin /exports $check.path
            if ($LASTEXITCODE) { throw "Cannot read exports: $($check.path)" }
            $exports | Write-Output
            if (-not ($exports -match ("\s" + [regex]::Escape($check.name) + "\s*$"))) {
              throw "Required exact native export absent: $($check.name)"
            }
          }

      - name: Publish Kaentake runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaentake-runtime
          path: |
            client/build-kaentake/Release/Kaentake.exe
            client/build-kaentake/Release/Kaentake.dll
            client/build-kaentake/Release/Custom.wz
            client/build-kaentake/kaentake-build.json

      - name: Collect genuine Microsoft app-local x86 CRT
        shell: pwsh
        run: ./client/tools/collect-msvc-runtime.ps1

      - name: Publish required x86 runtime dependencies
        uses: actions/upload-artifact@v4
        with:
          name: MSVC-x86-runtime
          path: client/msvc-x86-runtime/*

      - name: Opcode drift gate
        run: python tools/check_opcodes.py
        working-directory: client

      - name: Publish DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunsMS-dll
          # BunsMS.dll + .pdb ONLY. The WzLib Gr2D_DX8to9 shims build into the
          # same dir as a side effect but MUST NOT ship: staging them under
          # stock engine filenames can shadow the verified runtime. The shim
          # lacks Kaentake's expected renderer signatures; this is not a claim
          # that it caused the separately observed stock-runtime scan failure.
          # BunsMS.dll has no load-time dependency on these renderer shims.
          path: |
            client/build/Release/BunsMS.dll
            client/build/Release/BunsMS.pdb

  native-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kaentake-runtime
          path: native-runtime
      - uses: actions/download-artifact@v4
        with:
          name: BunsMS-dll
          path: native-companion
      - uses: actions/download-artifact@v4
        with:
          name: MSVC-x86-runtime
          path: native-crt
      - uses: actions/setup-java@v4
        if: inputs.test_backend
        with:
          distribution: temurin
          java-version: "21"
      - name: Keep matching real QA backend alive during native Windows capture
        shell: pwsh
        env:
          BACKEND_BUNDLE_URL: ${{ inputs.backend_bundle_url }}
          BACKEND_BUNDLE_SHA256: ${{ inputs.backend_bundle_sha256 }}
          BACKEND_XML_URL: ${{ inputs.backend_xml_url }}
          BACKEND_XML_SHA256: ${{ inputs.backend_xml_sha256 }}
          NATIVE_BASELINE_URL: ${{ inputs.native_baseline_url }}
          NATIVE_BASELINE_SHA256: ${{ inputs.native_baseline_sha256 }}
          NATIVE_BASELINE_FILES_URL: ${{ inputs.native_baseline_files_url }}
          NATIVE_TEST_BACKEND: ${{ inputs.test_backend }}
          NATIVE_EXERCISE_LOGIN: ${{ inputs.exercise_login }}
          NATIVE_PUBLISHED_RUNTIME: ${{ inputs.published_runtime }}
          NATIVE_ITEM_VARIANTS_URL: ${{ inputs.item_image_variants_url }}
          NATIVE_ITEM_VARIANTS_SHA256: ${{ inputs.item_image_variants_sha256 }}
        run: |
          $nativeExitCode = 0
          try {
            if ($env:NATIVE_TEST_BACKEND -eq 'true') {
              # Both child services were absent by the old separate capture step;
              # keep the owning PowerShell alive through the game attempt.
              ./client/tools/start-test-backend.ps1 `
                -BundleUrl $env:BACKEND_BUNDLE_URL -BundleSha256 $env:BACKEND_BUNDLE_SHA256 `
                -XmlUrl $env:BACKEND_XML_URL -XmlSha256 $env:BACKEND_XML_SHA256 `
                -MySqlSha256 a1bc2ad567eef672be20b591ad25b14f221e60bde3ae3eb235128d91e4166557
              if ($LASTEXITCODE) { throw 'Real QA backend did not start successfully' }
            }
            $gameHost = if ($env:NATIVE_TEST_BACKEND -eq 'true') { '127.0.0.1' } else { 'buns.asslorde.com' }
            ./client/tools/native-smoke.ps1 `
              -BaselineUrl $env:NATIVE_BASELINE_URL `
              -BaselineSha256 $env:NATIVE_BASELINE_SHA256 `
              -BaselineFilesBaseUrl $env:NATIVE_BASELINE_FILES_URL `
              -KaentakeArtifact native-runtime `
              -CompanionArtifact native-companion `
              -RuntimeArtifact native-crt `
              -GameHost $gameHost `
              -ExerciseLogin:($env:NATIVE_EXERCISE_LOGIN -eq 'true') `
              -PublishedRuntimeControl:($env:NATIVE_PUBLISHED_RUNTIME -eq 'true') `
              -ItemImageVariantsUrl $env:NATIVE_ITEM_VARIANTS_URL `
              -ItemImageVariantsSha256 $env:NATIVE_ITEM_VARIANTS_SHA256 `
              -OutputDirectory native-smoke-output
            $nativeExitCode = $LASTEXITCODE
          } finally {
            $path = 'native-backend-output/result.json'
            if ($env:NATIVE_TEST_BACKEND -eq 'true' -and (Test-Path $path)) {
              $backend = Get-Content $path -Raw | ConvertFrom-Json
              $stops = @(foreach ($entry in @(@{ id = $backend.serverPid; name = 'java' }, @{ id = $backend.mysqlPid; name = 'mysqld' })) {
                if (-not $entry.id) { continue }
                $row = [ordered]@{ utc = [DateTime]::UtcNow.ToString('O'); id = $entry.id; expectedName = $entry.name; controlled = $true; reason = 'Same-step QA controller cleanup after native observation; not a natural exit' }
                try {
                  $process = Get-Process -Id $entry.id -ErrorAction Stop
                  $row.actualName = $process.ProcessName
                  if ($process.ProcessName -eq $entry.name) {
                    Stop-Process -Id $entry.id -Force -ErrorAction Stop
                    $process.WaitForExit(5000) | Out-Null
                    $row.exited = $process.HasExited
                    if ($process.HasExited) { $row.exitCode = $process.ExitCode }
                  } else { $row.observation = 'PID identity changed; not stopped' }
                } catch { $row.observation = $_.Exception.Message }
                [pscustomobject]$row
              })
              $stops | ConvertTo-Json -Depth 6 | Set-Content native-backend-output/controlled-stops.json -Encoding utf8NoBOM
            }
          }
          if ($nativeExitCode) { exit $nativeExitCode }
      - name: Publish actual native startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-smoke
          path: |
            native-smoke-output/*.json
            native-smoke-output/*.png
            native-smoke-output/*.log
            native-smoke-output/crash-receipts/receipt.json
            native-smoke-output/published-control/*.json
            native-smoke-output/published-control/*.png
            native-smoke-output/published-control/*.log
            native-smoke-output/published-control/crash-receipts/receipt.json
            native-smoke-output/ordinary-login/*.json
            native-smoke-output/ordinary-login/*.png
            native-smoke-output/ordinary-login/*.log
            native-smoke-output/ordinary-login/crash-receipts/receipt.json
            native-smoke-output/archive-bisection/*/*.json
            native-smoke-output/archive-bisection/*/*.png
            native-smoke-output/archive-bisection/*/*.log
            native-smoke-output/archive-bisection/*/crash-receipts/receipt.json
            native-smoke-output/item-image-probes/*/*.json
            native-smoke-output/item-image-probes/*/*.png
            native-smoke-output/item-image-probes/*/*.log
            native-smoke-output/item-image-probes/*/crash-receipts/receipt.json
            native-backend-output/*.json
            native-backend-output/*.log
          if-no-files-found: warn
