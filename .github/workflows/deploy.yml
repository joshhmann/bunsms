name: Deploy private LXC services and build launcher

# Requires an explicitly configured reachable SSH route, host-key pin and
# restricted host command from deployment/buns-private-deploy.sh. Historical CI
# had no LXC connectivity; absent configuration fails closed, never falls back
# to Fly/R2 or pretends an unconfigured self-hosted runner is available.
# Game apply is deliberately NOT a deploy option: its independent release gate
# uses the authenticated Unix control operation after source/asset verification.
on:
  workflow_dispatch:
    inputs:
      dashboard:
        description: 'Deploy dashboard only (no Java/DB dependency restart)'
        type: boolean
        default: true
      web:
        description: 'Build and deploy matched browser static cohort and Python host service; never swap NX'
        type: boolean
        default: false
      launcher:
        description: 'Build launcher'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: private-lxc-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.dashboard || inputs.web }}
    runs-on: ubuntu-latest
    environment: private-lxc
    timeout-minutes: 90
    steps:
      - name: Deploy exact source through authenticated private SSH
        env:
          SSH_HOST: ${{ vars.BUNS_SSH_HOST }}
          SSH_USER: ${{ vars.BUNS_SSH_USER }}
          SSH_PORT: ${{ vars.BUNS_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.BUNS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BUNS_SSH_KNOWN_HOSTS }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOY_DASHBOARD: ${{ inputs.dashboard }}
          DEPLOY_WEB: ${{ inputs.web }}
        run: |
          set -euo pipefail
          set +x
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/buns_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/buns_deploy" "$HOME/.ssh/known_hosts"
          if [ "$DEPLOY_DASHBOARD" = true ]; then
            ssh -i "$HOME/.ssh/buns_deploy" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
              "sudo -n /usr/local/sbin/buns-private-deploy deploy-dashboard '$SOURCE_SHA'"
          fi
          if [ "$DEPLOY_WEB" = true ]; then
            ssh -i "$HOME/.ssh/buns_deploy" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" \
              "sudo -n /usr/local/sbin/buns-private-deploy deploy-web '$SOURCE_SHA'"
          fi
      - name: Remove ephemeral SSH credential
        if: always()
        run: rm -f "$HOME/.ssh/buns_deploy"

  build-launcher:
    if: ${{ inputs.launcher }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install dependencies
        working-directory: launcher
        run: npm ci
      - name: Build Windows installer
        working-directory: launcher
        run: npx electron-builder --win --x64
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunsms-launcher-installer
          path: launcher/dist/*.exe
          if-no-files-found: error
