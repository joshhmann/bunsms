services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: augurpass
      MYSQL_DATABASE: cosmic
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-paugurpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.local
    ports:
      - "9494:8484"
      - "7676:7575"
      - "7677:7576"
      - "7678:7577"
    environment:
      DB_PASS: augurpass
      DB_HOST: db
      GAME_HOST: 192.168.0.157
    volumes:
      - ./server/wz:/opt/server/wz
      - ./server/scripts:/opt/server/scripts:ro
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: augurpass
      DB_NAME: cosmic
      ADMIN_USER: admin
      ADMIN_PASS_HASH: ""
      JWT_SECRET: "augurms-test-jwt-secret-2026"
      COSMIC_ROOT: /cosmic
      NODE_ENV: production
    depends_on:
      server:
        condition: service_started

volumes:
  db-data:
