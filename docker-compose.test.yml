services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: bunspass
      MYSQL_DATABASE: cosmic
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbunspass"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.local
    ports:
      - "9494:8484"
      - "8484:8484"
      - "7575:7575"
      - "7576:7576"
      - "7577:7577"
    environment:
      DB_PASS: bunspass
      DB_HOST: db
      GAME_HOST: 192.168.0.164
      ASSET_BASE_URL: ${ASSET_BASE_URL:-https://buns.asslorde.com}
      WZ_BASELINE_URL: ${WZ_BASELINE_URL:-}
      WZ_BASELINE_HASH: ${WZ_BASELINE_HASH:-}
      WZ_BASELINE_SIZE: ${WZ_BASELINE_SIZE:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8484"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - ./server/wz:/opt/server/wz
      # Keep the installed complete script baseline; verified tar scripts are partial overlays.
      - ./server/scripts:/opt/server/scripts
      # Retains pre-overlay originals/pending recovery across server-only recreation.
      - ${BUNS_GAME_ASSET_STATE_DIR:-/opt/buns/game-asset-state}:/opt/server/.selfhost-assets
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      # Private LAN dashboard; public Caddy keeps mutations blocked.
      - "192.168.0.164:3001:3000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: bunspass
      DB_NAME: cosmic
      ADMIN_USER: admin
      ADMIN_PASS_HASH: ""
      JWT_SECRET: "bunsms-test-jwt-secret-2026"
      COSMIC_ROOT: /cosmic
      GAME_SERVER_HOST: server
      # Public native activation is deferred by owner; LAN/loopback test override remains explicit.
      GAME_CLIENT_HOST: ${GAME_CLIENT_HOST:-buns.asslorde.com}
      ASSET_BASE_URL: ${ASSET_BASE_URL:-https://buns.asslorde.com}
      ASSET_DIR: /assets
      LAUNCHER_MANIFEST_PATH: /manifests/launcher-manifest.json
      GAME_CONTROL_SOCKET: /run/buns-control/control.sock
      GM_API_SECRET: ${GM_API_SECRET:?Set the private GM API secret in the deployment environment}
      GM_SECRET_FILE: /run/secrets/gm_api_secret
    volumes:
      - ${BUNS_ASSET_DIR:-/opt/buns/client-assets}:/assets
      - ${BUNS_MANIFEST_DIR:-/opt/buns/manifest-writable}:/manifests
      - ${BUNS_CONTROL_DIR:-/run/buns-control}:/run/buns-control
      - ${GM_SECRET_FILE:?Set the host secret-file path}:/run/secrets/gm_api_secret:ro
    depends_on:
      server:
        condition: service_started

volumes:
  db-data:
